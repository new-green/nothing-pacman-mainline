# busybox udhcpd on the phone's USB network (see pacman-init.sh).
# Hands the PC exactly one address. Deliberately no "option router" / "option dns":
# the PC must keep its own default route and DNS.
interface	usb0
start		172.16.42.2
end		172.16.42.2
max_leases	1
lease_file	/tmp/udhcpd.leases
option	subnet	255.255.255.0
option	lease	86400
